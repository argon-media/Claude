<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="530" viewBox="0 0 1600 530">
<defs>
  <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#df3e43"/>
    <stop offset="0.38" stop-color="#da2025"/>
    <stop offset="0.55" stop-color="#d8141a"/>
    <stop offset="1" stop-color="#8c0d11"/>
  </linearGradient>
  <linearGradient id="shoulder" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1c1d20"/>
    <stop offset="1" stop-color="#050506"/>
  </linearGradient>
  <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="bodyClip"><path d="M 62,428 L 46,336 C 44,288 70,246 130,222 C 220,190 350,168 470,160 L 525,152 C 600,100 670,56 745,42 C 860,22 1010,20 1115,40 C 1205,62 1300,106 1385,130 L 1500,136 L 1522,148 C 1532,190 1532,240 1546,298 L 1556,350 C 1558,385 1548,420 1522,432 L 1356,432 A 125 125 0 1 0 1114,432 L 383,440 A 125 125 0 1 0 141,432 Z"/></clipPath>
</defs>

<ellipse cx="800" cy="505" rx="780" ry="22" fill="url(#shadow)"/>

